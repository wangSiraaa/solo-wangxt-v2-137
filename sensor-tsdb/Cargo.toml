[package]
name = "sensor-tsdb"
version = "0.1.0"
edition = "2021"
description = "Sensor test platform: immutable compressed segments + SQLite catalog + Axum API"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
crc32fast = "1"
